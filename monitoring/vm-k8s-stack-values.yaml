extraObjects:
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMServiceScrape
    metadata:
      name: demo-app
      namespace: default
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: demo-app
          app.kubernetes.io/instance: vm-demo
      namespaceSelector:
        matchNames:
          - default
      endpoints:
        - port: http
          path: /metrics